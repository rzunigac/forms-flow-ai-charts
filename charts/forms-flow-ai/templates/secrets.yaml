apiVersion: v1
kind: Secret
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
stringData:
  FORMIO_ROOT_EMAIL: {{ index .Values "forms-flow-forms" "admin" "email" | toString | quote }}
  FORMIO_ROOT_PASSWORD: {{ index .Values "forms-flow-forms" "admin" "password" | toString | quote }}
  {{- /* Defaults to the historical "<namespace>-jwt-secret" so upgrades keep issued tokens valid; set forms-flow-forms.jwtSecret. */}}
  FORMIO_JWT_SECRET: {{ (index .Values "forms-flow-forms" "jwtSecret") | default (printf "%s-jwt-secret" .Release.Namespace) | toString | quote }}
  KEYCLOAK_CLIENTID: {{ index .Values "forms-flow-bpm" "clientid" | toString | quote }}
  KEYCLOAK_CLIENTSECRET: {{ index .Values "forms-flow-bpm" "clientsecret" | toString | quote }}
  WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" | toString | quote }}
  WEBSOCKET_ENCRYPT_KEY: "{{ .Values.websocket_encrypt_key }}"
  ADMIN_WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" | toString | quote }}
  INSIGHT_API_KEY:  "{{ .Values.insight_api_key }}"
  REDIS_PASSCODE: "{{ .Values.redis_pass_code }}"
  IPAAS_EMBEDDED_API_KEY: "{{ .Values.ipaas.embedded_api_key }}"
  IPAAS_JWT_PRIVATE_KEY: "{{ .Values.ipaas.jwt_private_key }}"
  FORMIO_DB_NAME: "{{ .Values.mongodb.auth.databases | first }}"
  {{- if .Values.mongodb.enabled }} 
  NODE_CONFIG: '{"mongo":"mongodb://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}:{{ .Values.mongodb.service.ports.mongodb }}/{{ .Values.mongodb.auth.databases | first }}"}'
  MONGODB_URI:  {{ tpl "mongodb://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}:{{ .Values.mongodb.service.ports.mongodb }}/{{ .Values.mongodb.auth.databases | first }}" . }}
  {{- else }}
  MONGODB_URI:  {{ tpl "mongodb+srv://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}/{{ .Values.mongodb.auth.databases | first }}" . }} 
  NODE_CONFIG: '{"mongo":"mongodb+srv://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}/{{ .Values.mongodb.auth.databases | first }}"}'
  {{- end }}