apiVersion: v1
kind: Secret
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
stringData:
  FORMIO_ROOT_EMAIL: {{ index .Values "forms-flow-forms" "admin" "email" | toString | quote }}
  FORMIO_ROOT_PASSWORD: {{ index .Values "forms-flow-forms" "admin" "password" | toString | quote }}
  {{- /* Defaults to the historical "<namespace>-jwt-secret" so upgrades keep issued tokens valid; set forms-flow-forms.jwtSecret. */}}
  FORMIO_JWT_SECRET: {{ (index .Values "forms-flow-forms" "jwtSecret") | default (printf "%s-jwt-secret" .Release.Namespace) | toString | quote }}
  KEYCLOAK_CLIENTID: {{ index .Values "forms-flow-bpm" "clientid" | toString | quote }}
  KEYCLOAK_CLIENTSECRET: {{ index .Values "forms-flow-bpm" "clientsecret" | toString | quote }}
  WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" | toString | quote }}
  WEBSOCKET_ENCRYPT_KEY: {{ .Values.websocket_encrypt_key | toString | quote }}
  ADMIN_WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" | toString | quote }}
  INSIGHT_API_KEY: {{ .Values.insight_api_key | toString | quote }}
  REDIS_PASSCODE: {{ .Values.redis_pass_code | toString | quote }}
  IPAAS_EMBEDDED_API_KEY: {{ .Values.ipaas.embedded_api_key | toString | quote }}
  IPAAS_JWT_PRIVATE_KEY: {{ .Values.ipaas.jwt_private_key | toString | quote }}
  FORMIO_DB_NAME: {{ .Values.mongodb.auth.databases | first | toString | quote }}
  {{- /* The user and password are percent-encoded, so ":", "@", "/", "%" and spaces don't break the URI. */}}
  {{- $mongo := .Values.mongodb }}
  {{- $user := $mongo.auth.usernames | first | toString | urlquery | replace "+" "%20" }}
  {{- $password := $mongo.auth.passwords | first | toString | urlquery | replace "+" "%20" }}
  {{- $db := $mongo.auth.databases | first | toString }}
  {{- $mongoUri := printf "mongodb+srv://%s:%s@%s/%s" $user $password $mongo.service.nameOverride $db }}
  {{- if $mongo.enabled }}
  {{- $mongoUri = printf "mongodb://%s:%s@%s:%v/%s" $user $password $mongo.service.nameOverride $mongo.service.ports.mongodb $db }}
  {{- end }}
  NODE_CONFIG: {{ dict "mongo" $mongoUri | toJson | quote }}
  MONGODB_URI: {{ $mongoUri | quote }}
